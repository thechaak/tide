<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tide Mock App</title>
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f4f5f9">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tideBlue: '#1624c2',
                        tideBlueLight: '#2c3ae8',
                        tideBg: '#f4f5f9',
                        tideTextDark: '#1d1d2b',
                        tideTextGray: '#7a7a8c',
                        tideRed: '#d92d20',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f5f9;
            /* Prevent bounce on iOS */
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for clean app look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* Splash Screen Animation Styles */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: white;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }

        #splash-content {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #splash-bg-expander {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: #4452FE; /* Exact blue from tide logo */
            border-radius: 30px;
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
        }

        #splash-logo {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 30px;
            z-index: 2;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        /* Animation classes toggled by JS */
        .splash-expand {
            transform: scale(25); /* Scale up circle to cover screen */
        }
        .splash-fade-logo {
            opacity: 0;
        }
        .splash-hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-tideTextDark font-sans relative antialiased selection:bg-blue-200">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div id="splash-content">
            <div id="splash-bg-expander"></div>
            <!-- Assumes tide.png is in the same directory -->
            <img src="tide.png" id="splash-logo" alt="Tide Logo" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="max-w-md mx-auto min-h-screen relative bg-tideBg pb-24 shadow-2xl">
        
        <!-- Header area (spacing for status bar simulated) -->
        <div class="pt-12 px-5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-white border border-gray-200 flex items-center justify-center text-sm font-semibold text-tideBlue">
                    PB
                </div>
                <button class="px-4 py-1.5 rounded-full border-2 border-blue-100 bg-white text-tideBlueLight text-[13px] font-semibold hover:bg-gray-50 transition">
                    Upgrade
                </button>
            </div>
            
            <div class="flex items-center space-x-4">
                <button class="px-4 py-1.5 rounded-full border-2 border-blue-100 bg-white text-tideBlueLight text-[13px] font-semibold hover:bg-gray-50 transition">
                    Get £150
                </button>
                <button class="text-tideBlueLight">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button class="text-tideBlueLight">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="9" y1="9" x2="15" y2="9"></line><line x1="9" y1="13" x2="15" y2="13"></line></svg>
                </button>
            </div>
        </div>

        <!-- Account Selector -->
        <div class="mt-6 flex justify-center items-center cursor-pointer">
            <h1 class="text-[22px] font-semibold text-[#1a1a2e]">P builders LTD</h1>
            <div class="ml-2 w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <!-- Stacked Cards Section -->
        <div class="relative mt-5 mx-4 h-64">
            
            <!-- Back Card (Instant Saver) -->
            <div class="absolute top-0 left-1 right-1 h-24 rounded-[28px] bg-gradient-to-r from-[#9b26c0] via-[#c61ebd] to-[#d61eb4] px-5 pt-4 shadow-sm" style="transform: translateY(0);">
                <div class="flex justify-between items-start text-white">
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 rounded-full bg-[#fbbc04] text-black flex items-center justify-center font-bold text-xs">!</div>
                        <span class="font-medium text-[15px]">Tide Instant Saver</span>
                    </div>
                    <span class="font-medium text-[15px]">£0.00</span>
                </div>
            </div>

            <!-- Front Card (Current Account) -->
            <div class="absolute top-[38px] left-0 right-0 h-48 rounded-[28px] bg-[#1a2bcf] p-5 text-white shadow-[0_8px_30px_rgb(0,0,0,0.12)]">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 rounded-full bg-[#fbbc04] text-black flex items-center justify-center font-bold text-xs">!</div>
                        <span class="font-medium text-[15px]">Tide Current Account</span>
                    </div>
                    <span class="text-2xl font-semibold tracking-tight">£5,858.36</span>
                </div>
                
                <div class="flex items-center space-x-1 mb-6">
                    <span class="text-[13px] opacity-90">Account paused</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-90"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>

                <div class="text-center mt-3 px-2">
                    <p class="text-[14px] leading-snug font-medium text-white/90">Contact our support team for information and assistance.</p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-2 px-6 flex justify-between items-start">
            <div class="flex flex-col items-center gap-2 cursor-pointer">
                <div class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center text-tideBlueLight">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </div>
                <span class="text-[13px] font-medium text-tideTextGray">Send</span>
            </div>
            
            <div class="flex flex-col items-center gap-2 cursor-pointer">
                <div class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center text-tideBlueLight">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                </div>
                <span class="text-[13px] font-medium text-tideTextDark">Get paid</span>
            </div>

            <div class="flex flex-col items-center gap-2 cursor-pointer">
                <div class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center text-tideBlueLight">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                </div>
                <span class="text-[13px] font-medium text-tideTextDark">Cards</span>
            </div>

            <div class="flex flex-col items-center gap-2 cursor-pointer">
                <div class="w-14 h-14 rounded-full bg-white shadow-sm flex items-center justify-center text-tideBlueLight">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
                </div>
                <span class="text-[13px] font-medium text-tideTextDark">More</span>
            </div>
        </div>

        <!-- Transactions List -->
        <div class="mt-6 bg-white rounded-t-[32px] pt-6 px-5 min-h-[400px]">
            <h2 class="text-[17px] font-medium text-[#1a1a2e] mb-5">Transactions</h2>
            
            <div class="space-y-6">
                <!-- Transaction 1 -->
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center text-[#d92d20]">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        </div>
                        <span class="text-[16px] font-medium text-[#1a1a2e]">Rentola</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[#d92d20] font-medium mb-1">£35.00</span>
                        <span class="text-[#d92d20] text-[10px] font-bold tracking-wider px-1.5 py-0.5 border border-[#d92d20] rounded shadow-sm">DECLINED</span>
                    </div>
                </div>

                <!-- Divider -->
                <div class="h-[1px] bg-gray-100 ml-16"></div>

                <!-- Transaction 2 -->
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-green-50 flex items-center justify-center text-green-700 font-bold text-lg">
                            <span class="tracking-tighter">qb</span>
                        </div>
                        <span class="text-[16px] font-medium text-[#1a1a2e]">Intuit</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[#d92d20] font-medium mb-1">£14.76</span>
                        <span class="text-[#d92d20] text-[10px] font-bold tracking-wider px-1.5 py-0.5 border border-[#d92d20] rounded shadow-sm">DECLINED</span>
                    </div>
                </div>
                
                 <!-- Divider -->
                 <div class="h-[1px] bg-gray-100 ml-16"></div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-[#fafafa] border-t border-gray-200 pb-safe pt-2 px-2 flex justify-between z-40">
            <!-- Env safe area fallback for padding -->
            <style>
                .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
            </style>
            
            <div class="flex-1 flex flex-col items-center justify-center py-2 cursor-pointer text-tideBlue">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line><rect x="6" y="14" width="4" height="2" rx="1" fill="currentColor"></rect></svg>
                <span class="text-[11px] font-medium">Pay</span>
            </div>
            
            <div class="flex-1 flex flex-col items-center justify-center py-2 cursor-pointer text-gray-400 hover:text-gray-600 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span class="text-[11px] font-medium">Sell</span>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center py-2 cursor-pointer text-gray-400 hover:text-gray-600 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="text-[11px] font-medium">Buy</span>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center py-2 cursor-pointer text-gray-400 hover:text-gray-600 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <span class="text-[11px] font-medium">Admin</span>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center py-2 cursor-pointer text-gray-400 hover:text-gray-600 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
                <span class="text-[11px] font-medium">Finance</span>
            </div>
        </div>
    </div>

    <!-- Script for Splash Screen Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splash-screen');
            const bgExpander = document.getElementById('splash-bg-expander');
            const logo = document.getElementById('splash-logo');

            // Sequence timing
            setTimeout(() => {
                // 1. Expand the blue background
                bgExpander.classList.add('splash-expand');
                
                // Optional: Fade out logo slightly before the main screen reveals
                setTimeout(() => {
                    logo.classList.add('splash-fade-logo');
                }, 300);

                // 2. Fade out the whole splash container
                setTimeout(() => {
                    splashScreen.classList.add('splash-hidden');
                }, 600); // Wait for background expansion to almost finish
                
            }, 800); // Initial delay to show the logo
        });
    </script>
</body>
</html>
